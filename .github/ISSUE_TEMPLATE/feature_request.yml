name: Feature Request
description: Suggest a new feature or enhancement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user or business problem are you trying to solve?
      placeholder: The current behavior does not allow...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the preferred solution.
      placeholder: We should add...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List alternatives and why they were not chosen.

  - type: textarea
    id: scope
    attributes:
      label: Scope and Impact
      description: Mention expected UX, API, performance, or security impact.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This is not a duplicate of an existing request.
          required: true
        - label: I am willing to contribute this feature if approved.
          required: false
