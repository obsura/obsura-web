<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Obsura</title>
  <style>
    :root {
      --bg-color: #fafaf9; /* stone-50 */
      --text-main: #1c1917; /* stone-900 */
      --text-muted: #57534e; /* stone-500 */
      --accent-color: #4f46e5; /* indigo-600 */
      --accent-hover: #4338ca; /* indigo-700 */
      --border-color: #e5e5e5; /* stone-200 */
    }

    body {
      margin: 0;
      padding: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 28rem;
      padding: 2rem;
      text-align: center;
    }

    .icon-wrapper {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .icon {
      width: 2rem;
      height: 2rem;
      opacity: 0.5;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin: 0 0 2rem 0;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: white;
      background-color: var(--accent-color);
      border-radius: 0.375rem;
      text-decoration: none;
      transition: background-color 0.15s ease-in-out;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    a.button:hover {
      background-color: var(--accent-hover);
    }

    .error-code {
      margin-top: 3rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      color: #a8a29e; /* stone-400 */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1>Page not found</h1>
    <p>Sorry, we couldn't find the page you're looking for. The link might be broken or the page may have been removed.</p>
    <a href="/" class="button">Return to home</a>
    <div class="error-code">Error Code: 404</div>
  </div>
</body>
</html>
